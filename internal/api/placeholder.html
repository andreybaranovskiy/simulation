<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation Platform</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1020;
    --panel: #0f1430;
    --line: #243068;
    --text: #e8eefc;
    --muted: #a9b6e8;
    --accent: #6b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: min(640px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  h2 { margin: 24px 0 8px; font-size: 13px; text-transform: uppercase;
       letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  pre {
    margin: 0;
    padding: 12px 14px;
    background: #0a0f28;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow-x: auto;
    font: 13px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
    color: #cfe0ff;
  }
  ul { margin: 0; padding-left: 20px; color: var(--muted); }
  li { margin: 4px 0; }
  code { color: #cfe0ff; }
  a { color: var(--accent); }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted); margin-top: 24px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
</style>
</head>
<body>
<main>
  <h1>Simulation Platform</h1>
  <p class="lead">The API server is running. The web interface has not been built yet.</p>

  <h2>Build the frontend</h2>
  <pre>cd web
npm install
npm run build</pre>

  <h2>Check the API</h2>
  <ul>
    <li><a href="/api/health">/api/health</a> reports server and database status</li>
    <li><code>/api/auth/config</code> describes the sign-in options</li>
  </ul>

  <div class="status"><span class="dot"></span> Server responding</div>
</main>
</body>
</html>
