# Simulation Platform server configuration.
#
# Copy to config.yaml and edit. Every value below is a default, so a key you do
# not care about can be deleted. Secrets should come from the environment
# instead of this file: see the SIM_ variables at the bottom.

server:
  # Local listen address. IIS reverse-proxies to this, so loopback is correct
  # for a production install. Use 0.0.0.0:8080 only when nothing fronts it.
  addr: 127.0.0.1:8080

  # The address users type in the browser. Used for links and for the PDF
  # exporter to reach the print routes.
  base_url: http://127.0.0.1:8080

  # Directory holding the built frontend (web/dist after npm run build).
  web_root: web/dist

  read_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 20s

  # Read X-Forwarded-For and X-Forwarded-Proto. Turn this on when IIS is in
  # front and off otherwise: a client can forge these headers directly.
  trust_proxy_headers: false

database:
  host: 127.0.0.1
  port: 3306
  name: simulation
  user: simulation
  # Leave empty here and set SIM_DB_PASSWORD in the environment instead.
  password: ""

  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m

  # Apply pending schema migrations at startup.
  auto_migrate: true

storage:
  # Uploaded assets, run artifacts and generated PDFs. On a server, put this on
  # a data volume, not under the application directory.
  data_dir: data

  # Largest single upload, in bytes. 512 MiB.
  max_upload_bytes: 536870912

  # Total asset bytes per project. 0 means unlimited.
  project_quota_bytes: 0

auth:
  cookie_name: sim_session
  session_ttl: 336h

  # Set to true whenever the site is served over HTTPS. It also turns on HSTS.
  secure_cookies: false

  bcrypt_cost: 12

  # Allow anyone to create an account. The very first account created on an
  # empty instance always becomes an administrator.
  allow_registration: true

  # Creates this administrator at startup if no accounts exist at all. Prefer
  # setting these through the environment; the password must be at least 12
  # characters and both values must be given together.
  bootstrap_admin_email: ""
  bootstrap_admin_password: ""

engine:
  # The simrunner executable. Empty looks for it next to simserver.
  runner_path: ""

  # Simultaneous simulation processes. Defaults to half the CPU cores.
  max_concurrent_runs: 0

  run_timeout: 2h
  run_memory_limit_bytes: 4294967296

plugins:
  # Compiles and runs Go simulation models uploaded by users. This executes
  # user-supplied code on this server. Read deploy/iis/SECURITY.md before
  # turning it on, and grant the per-account permission to specific users only.
  enabled: false

  go_toolchain: go
  build_timeout: 2m

  # Optional low-privilege Windows account that builds and runs under.
  build_user: ""

report:
  # Chromium-family executable used to print PDFs. Empty autodetects and
  # prefers the Microsoft Edge that ships with Windows Server.
  browser_path: ""
  timeout: 3m

log:
  level: info      # debug, info, warn, error
  format: text     # text or json
  file: ""         # empty logs to stdout

# Environment overrides. These win over everything above, and are the right
# place for anything secret.
#
#   SIM_CONFIG                    path to this file
#   SIM_DB_PASSWORD               database password
#   SIM_COOKIE_KEY                64 hex characters (32 bytes) signing key
#   SIM_BOOTSTRAP_ADMIN_EMAIL     first administrator
#   SIM_BOOTSTRAP_ADMIN_PASSWORD  first administrator's password
#   SIM_SERVER_ADDR  SIM_BASE_URL  SIM_WEB_ROOT  SIM_DATA_DIR
#   SIM_SECURE_COOKIES  SIM_ALLOW_REGISTRATION  SIM_TRUST_PROXY_HEADERS
#   SIM_PLUGINS_ENABLED  SIM_LOG_LEVEL  SIM_LOG_FILE
